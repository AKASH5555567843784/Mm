name: Build & Publish Debug APK v0.0.5

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17 Temurin
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Grant gradlew permission and show versions
        run: |
          chmod +x ./gradlew
          java -version
          ./gradlew --version

      - name: Create temp debug keystore if not exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "Creating debug.keystore..."
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias AndroidDebugKey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK found successfully!"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "::error::APK missing at app/build/outputs/apk/debug/app-debug.apk"
            find app/build/outputs -type f || true
            exit 1
          fi

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Prepare release asset
        id: prepare_asset
        run: |
          RELEASE_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "$RELEASE_DIR/app-debug.apk"
          APK_SHA=$(sha256sum "$RELEASE_DIR/app-debug.apk" | awk '{print $1}')
          APK_SIZE=$(du -h "$RELEASE_DIR/app-debug.apk" | awk '{print $1}')
          echo "SHA256: $APK_SHA"
          echo "Size: $APK_SIZE"
          echo "apk_path=$RELEASE_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "apk_sha=$APK_SHA" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"

      - name: Create unique tag & Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.0.5-DEBUG-BUILD_${{ github.run_number }}_${{ github.run_attempt }}_$(date +%Y%m%d_%H%M%S)"
          TITLE="Debug Build v0.0.5_${{ github.run_number }}"
          NOTES="Auto generated debug APK, Run: ${{ github.run_number }}, Commit: ${{ github.sha }}, SHA256: ${{ steps.prepare_asset.outputs.apk_sha }}"
          
          echo "Publishing release with tag: $TAG"
          gh release create "$TAG" "${{ steps.prepare_asset.outputs.apk_path }}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest
          
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Verify release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Verifying published release..."
          gh release view "$TAG"
